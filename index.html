
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReadyCare QR 掃描器</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f4f7f8;
      color: #24323b;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 560px;
      margin: auto;
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #176b5b; margin-top: 0; }
    #reader { margin: 16px 0; }
    button {
      background: #176b5b;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    input {
      padding: 11px;
      border: 1px solid #ccd5da;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0;
    }
    .notice {
      background: #eff6ff;
      border-radius: 8px;
      padding: 12px;
      overflow-wrap: anywhere;
    }
    .error { background: #fef2f2; color: #991b1b; }
  </style>
</head>
<body>
<main>
  <h1>ReadyCare QR 掃描器</h1>
  <p>掃描設備 QR Code，自動返回管理中心查詢。</p>
  <div id="reader"></div>
  <div id="message" class="notice">
    請允許相機權限，或使用下方手動輸入。
  </div>
  <label for="manualId">手動輸入設備編號</label>
  <input id="manualId" placeholder="例如 W04" autocomplete="off">
  <button onclick="submitManual()">返回管理中心查詢</button>
</main>

<script>
const APP_URL =
  "https://script.google.com/a/macros/go.thu.edu.tw/s/AKfycbyDPvMKPLWLY4xYWdnN_0j8vTzCpiwSHlh-3SjN7wDEFACQYTQPFbEB83jTO_TPneQpVw/exec";

let handled = false;

function message(text, error) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "notice" + (error ? " error" : "");
}

function normalizeId(raw) {
  let value = String(raw || "").trim();

  try {
    if (/^https?:\/\//i.test(value)) {
      const url = new URL(value);
      value =
        url.searchParams.get("equipmentId") ||
        url.searchParams.get("id") ||
        "";
    }
  } catch (e) {
    return "";
  }

  return /^[A-Za-z0-9_-]+$/.test(value) ? value : "";
}

function goToDashboard(raw) {
  const id = normalizeId(raw);

  if (!id) {
    message("無法辨識設備編號，請輸入 W04 這類編號。", true);
    return;
  }

  if (handled) return;
  handled = true;

  const params = new URLSearchParams(window.location.search);
  const requested = params.get("returnUrl") || "";
  const base = requested === APP_URL ? requested : APP_URL;

  const target = new URL(base);
  target.searchParams.set("dashboard", "1");
  target.searchParams.set("equipmentId", id);

  message("掃描成功：" + id + "，正在返回管理中心…");
  window.location.assign(target.toString());
}

function submitManual() {
  goToDashboard(document.getElementById("manualId").value);
}

document.getElementById("manualId")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") submitManual();
  });

if (typeof Html5QrcodeScanner === "undefined") {
  message("掃描元件載入失敗，請確認網路或手動輸入。", true);
} else {
  const scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: { width: 220, height: 220 } },
    false
  );

  scanner.render(
    decodedText => goToDashboard(decodedText),
    () => {}
  );
}
</script>
</body>
</html>

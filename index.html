
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadyCare QR 掃描器</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px;
      background: #f4f7f8;
      color: #24323b;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px #0000000d;
    }
    button {
      padding: 12px 16px;
      margin: 5px 5px 5px 0;
      border: 0;
      border-radius: 8px;
      background: #176b5b;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { opacity: .5; }
    #reader {
      width: 100%;
      margin-top: 16px;
    }
    #message {
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
    .muted { color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ReadyCare</h1>
    <p>掃描設備 QR Code，讀取設備編號。</p>

    <button id="startButton" onclick="startScanner()">開啟相機並掃描</button>
    <button id="stopButton" onclick="stopScanner()" disabled>停止相機</button>

    <div id="reader"></div>
    <div id="message" role="status">請允許瀏覽器使用相機。</div>
  </div>

  <script>
    let scanner = null;
    let scanning = false;
    let handlingResult = false;

    const params = new URLSearchParams(window.location.search);
    const returnUrl = params.get("returnUrl");

    function showMessage(message) {
      document.getElementById("message").textContent = message;
    }

    function extractEquipmentId(text) {
      const value = String(text || "").trim();
      if (!value) return "";

      // QR Code 可能只包含 W04。
      if (/^[a-zA-Z0-9_-]+$/.test(value)) {
        return value;
      }

      // 如果 QR Code 是完整網址，也嘗試取得 equipmentId。
      try {
        const url = new URL(value);
        const id = url.searchParams.get("equipmentId");
        if (id) return id.trim();
      } catch (error) {}

      // 也支援 equipmentId=W04 這種文字格式。
      const match = value.match(/[?&#]equipmentId=([^&#]+)/i);
      if (match) {
        try {
          return decodeURIComponent(match[1]).trim();
        } catch (error) {
          return match[1].trim();
        }
      }

      return "";
    }

    function returnToDashboard(equipmentId) {
      if (!returnUrl) {
        showMessage("掃描成功，設備編號：" + equipmentId +
          "。目前沒有收到 Dashboard 回傳網址。");
        return;
      }

      try {
        const target = new URL(returnUrl);

        // 只允許返回指定的 ReadyCare Apps Script Web App。
        if (
          target.origin !== "https://script.google.com" ||
          !target.pathname.includes("/s/AKfycbyDPvMKPLWLY4xYWdnN_0j8vTzCpiwSHlh-3SjN7wDEFACQYTQPFbEB83jTO_TPneQpVw/exec")
        ) {
          showMessage("回傳網址驗證失敗，請從 ReadyCare Dashboard 重新開啟掃描器。");
          return;
        }

        // 以 query parameter 傳送設備編號，不再依賴 URL hash。
        target.searchParams.set("dashboard", "1");
        target.searchParams.set("equipmentId", equipmentId);

        showMessage("掃描成功！設備編號：" + equipmentId + "，正在返回 Dashboard……");
        window.location.assign(target.toString());
      } catch (error) {
        showMessage("回傳失敗：" + error.message);
      }
    }

    async function startScanner() {
      if (scanning) return;

      try {
        handlingResult = false;
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          async function(decodedText) {
            if (handlingResult) return;

            const id = extractEquipmentId(decodedText);
            if (!id) {
              showMessage("已讀取 QR Code，但找不到有效的設備編號。內容：" + decodedText);
              return;
            }

            handlingResult = true;
            showMessage("掃描成功，設備編號：" + id + "。正在停止相機……");

            try {
              if (scanner && scanning) {
                await scanner.stop();
                scanning = false;
              }
            } catch (error) {
              // 即使停止相機失敗，仍嘗試返回 Dashboard。
            }

            document.getElementById("startButton").disabled = false;
            document.getElementById("stopButton").disabled = true;

            returnToDashboard(id);
          },
          function() {
            // 忽略每一幀尚未辨識到 QR Code 的訊息。
          }
        );

        scanning = true;
        document.getElementById("startButton").disabled = true;
        document.getElementById("stopButton").disabled = false;
        showMessage("相機已開啟，請將設備 QR Code 對準掃描框。");
      } catch (error) {
        scanning = false;
        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;
        showMessage("無法開啟相機：" + error +
          "。請確認使用 HTTPS 網址，並允許瀏覽器使用相機。");
      }
    }

    async function stopScanner() {
      if (!scanner || !scanning) return;

      try {
        await scanner.stop();
        scanning = false;
        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;
        showMessage("相機已停止。");
      } catch (error) {
        showMessage("停止相機時發生錯誤：" + error);
      }
    }
  </script>
</body>
</html>
